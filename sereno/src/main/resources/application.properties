spring.application.name=sereno-api
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:h2:mem:sereno;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.table=SER_FLYWAY_HISTORICO
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

sereno.jwt.secret=${JWT_SECRET:}
sereno.jwt.issuer=sereno-auth
sereno.jwt.audience=sereno-app
sereno.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}

sereno.cors.allowed-origins=${CORS_ORIGINS:*}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.default-requeue-rejected=false

spring.ai.openai.api-key=COLE_SUA_CHAVE_AQUI
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.3
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=5s
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=40s

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

server.error.include-stacktrace=never
server.error.include-message=never
